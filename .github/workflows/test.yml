# The repository had no test workflow at all until 2.3.0. Its only workflow was
# `release`, and that one built and published without running anything — which
# is how 2.1.2 reached PyPI with a decoder that mapped every index to the wrong
# character, and stayed there.
#
# Nothing here needs the network or a 46MB model: the suite runs against a fake
# onnxruntime session that reports the same two numbers off the graph that the
# real one does.
name: test

on:
  push:
  pull_request:

# Declared, where this file previously declared nothing and inherited the
# repository default. That default is a repository setting, not a property of
# this file: set to read-write, every job here would hold a GITHUB_TOKEN that
# can push commits and move tags, on a workflow that runs on `push` from any
# branch. Every job here checks out, builds, tests or scans; none writes.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared by requires-python, and the current release.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # --locked, not a plain sync: it fails when pyproject.toml has moved and
      # uv.lock has not, rather than quietly resolving something else and
      # testing a dependency set that no install will ever reproduce.
      - name: Install from the committed lockfile
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  no-model-weights:
    # Model weights must never be committed to this repository. They are
    # downloaded from Hugging Face at the revision pinned in config.py, so a
    # copy here is dead weight, a second answer to "which weights does this
    # release use", and a licensing surface on a public repo.
    #
    # src/monocr/models/monocr.ckpt was tracked until 2.3.0: an LFS pointer to
    # 177MB that no code path loaded. .gitignore lists the extensions; this is
    # what makes the rule fail a build instead of relying on everyone
    # remembering it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse tracked model weights
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          found="$(printf '%s\n' "$tracked" \
            | grep -iE '\.(ckpt|pt|pth|safetensors|onnx|tflite|mlmodel)$' || true)"
          if [ -n "$found" ]; then
            echo "::error title=Model weights are tracked::$(printf '%s' "$found" | tr '\n' ' ')"
            exit 1
          fi
          echo "no tracked model weights"

  import-on-a-slim-image:
    # The claim behind opencv-python-headless, tested rather than asserted.
    # cv2 is imported unconditionally by segmenter.py, so with the GUI build
    # `import monocr` fails on any image lacking the X libraries OpenCV links
    # against — 2.2.0 raises `ImportError: libxcb.so.1` here. python:3.12-slim
    # is such an image; ubuntu-latest is not, so the pytest job above runs green
    # either way and cannot catch this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build a wheel
        run: uv build --wheel --no-sources

      # The wheel is what users actually receive, so check it carries no weights
      # even if something slipped past the tracking guard above.
      - name: The wheel must ship no model weights
        run: |
          set -euo pipefail
          contents="$(unzip -Z1 dist/*.whl)"
          found="$(printf '%s\n' "$contents" \
            | grep -iE '\.(ckpt|pt|pth|safetensors|onnx|tflite|mlmodel)$' || true)"
          if [ -n "$found" ]; then
            echo "::error title=Weights in the wheel::$(printf '%s' "$found" | tr '\n' ' ')"
            exit 1
          fi
          echo "wheel carries no model weights"

      - name: Import it where there is no libGL
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.12-slim sh -c '
            set -e
            pip install --quiet --disable-pip-version-check dist/*.whl
            python -c "import monocr; print(\"imported\", monocr.__version__)"
            python -c "import cv2; print(\"cv2 ok\")"
          '

  # Lints every workflow in this repository for the defects that turn CI into
  # a way in: unpinned actions, credentials persisted into the workspace,
  # caches restored into publish jobs, template injection, over-broad tokens.
  # release.yml holds `id-token: write` for PyPI, so a defect there is a
  # defect in what gets published under this project's name.
  #
  # Scans the repository root (the action's default input, `.`), not only
  # .github/workflows, so the CI gate and a local run cover the same files.
  # Reproduce locally with:  uvx zizmor@1.30.1 --offline .
  # The local run skips the online audits; this job runs them.
  #
  # `advanced-security: false` because uploading SARIF needs
  # `security-events: write`, and results as annotations are readable by anyone
  # who can see the run — the job log is not.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # Scans the full git history for committed credentials, not just the tree: a
  # secret removed in a later commit is still in every clone. fetch-depth 0 is
  # what makes the history available to scan.
  #
  # The gitleaks binary, not gitleaks-action: the action needs a paid licence
  # once a repository is organization-owned, and the binary needs no token at
  # all. Pinned to a version AND the SHA-256 of its
  # release tarball, from the release's gitleaks_8.30.1_checksums.txt, so the
  # URL cannot serve something else on a later day. TO BUMP: take the
  # linux_x64 line from the new release's checksums file and verify it against
  # a download before changing either value.
  #
  # `--redact` keeps any secret it finds out of the log. A finding is
  # annotated as file and line only.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "${RUNNER_TEMP}" -f "${RUNNER_TEMP}/gitleaks.tar.gz" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan the full history for secrets
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks.json"
          set +e
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner --no-color \
            --report-format json --report-path "$report" .
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ -s "$report" ]; then
              jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks: \(.RuleID)::commit \(.Commit[0:12])"' "$report"
            fi
            exit "$status"
          fi
