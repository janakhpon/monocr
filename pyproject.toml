[project]
name = "monocr"
version = "2.3.0"
description = "Optical Character Recognition for Mon text"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "janakhpon", email = "jnovaxer@gmail.com" }
]
license = "MIT"
keywords = ["mon", "ocr", "text-recognition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "onnxruntime>=1.15.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "click>=8.0.0",
    # headless, not opencv-python. cv2 is imported unconditionally by
    # segmenter.py, so the GUI build makes `import monocr` fail outright on any
    # image missing the X libraries it links. MEASURED 2026-08-16 on
    # python:3.12-slim: 2.2.0 raises ImportError: libxcb.so.1, 2.3.0 imports.
    # Nothing in this package draws to a screen.
    "opencv-python-headless>=4.0.0",
    "huggingface_hub>=0.16.0",
]

[project.optional-dependencies]
examples = ["pdf2image"]
test = ["pytest"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pdf2image>=1.17.0",
]


[project.urls]
Repository = "https://github.com/janakhpon/monocr"
Changelog = "https://github.com/janakhpon/monocr/blob/main/CHANGELOG.md"
Issues = "https://github.com/janakhpon/monocr/issues"
"Model card" = "https://huggingface.co/janakhpon/monocr"

[project.scripts]
monocr = "monocr.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monocr = ["assets/*"]
